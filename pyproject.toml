[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvn-rl-access-experiments"
version = "0.1.0"
description = "Reproducible cognitive vehicular network RL access experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==3.0.3",
  "scipy==1.13.1",
  "scikit-learn==1.9.0",
  "matplotlib==3.11.0",
  "torch==2.11.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
backbones = ["xgboost==3.3.0", "pyarrow==24.0.0"]

[project.scripts]
cvn-run = "cvn_rl.experiments.run_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cvn_rl*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "tmp/pytest/cache"
